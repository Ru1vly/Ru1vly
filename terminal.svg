<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 265" width="620" height="265">
  <style>
    .window { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; }
    .titlebar { fill: #161b22; }
    .border { stroke: #30363d; stroke-width: 1px; }
    .text {
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13.5px;
      letter-spacing: 0.3px;
    }
    .prompt { fill: #7ee787; font-weight: 600; }
    .cmd { fill: #e6edf3; }
    .out { fill: #8b949e; }
    .type { fill: #38bdf8; }
    .cursor {
      animation: blink 0.9s infinite;
      fill: #38bdf8;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Window Frame -->
  <rect x="1" y="1" width="618" height="263" rx="8" class="window" />
  <path d="M 1,9 A 8,8 0 0,1 9,1 L 611,1 A 8,8 0 0,1 619,9 L 619,34 L 1,34 Z" class="titlebar" />
  <line x1="1" y1="34" x2="619" y2="34" class="border" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" />
  <text x="310" y="22" fill="#8b949e" font-size="12" class="text" text-anchor="middle">ru1vly@box:~</text>

  <!-- Terminal Content -->
  <g class="text" xml:space="preserve">
    <text x="25" y="65"><tspan class="prompt">ru1vly:~$</tspan><tspan class="cmd"> whoami</tspan></text>
    <text x="25" y="88" class="out">kerem — typescript, rust, python, java</text>

    <text x="25" y="125"><tspan class="prompt">ru1vly:~$</tspan><tspan class="cmd"> cat status.txt</tspan></text>
    <text x="25" y="148" class="out">- code compiles (eventually)</text>
    <text x="25" y="168" class="out">- works on my machine</text>
    <text x="25" y="188" class="out">- still don't know what to put in this readme</text>

    <text x="25" y="228"><tspan class="prompt">ru1vly:~$ </tspan></text>
  </g>

  <!-- Animated Typing Paths -->
  <defs>
    <path id="p0" d="m110,228 h0">
      <animate id="a0" attributeName="d" begin="0s;a3.end" dur="4s" fill="remove"
        values="m110,228 h0 ; m110,228 h450 ; m110,228 h450 ; m110,228 h0" keyTimes="0;0.5;0.8;1" />
    </path>
    <path id="p1" d="m110,228 h0">
      <animate id="a1" attributeName="d" begin="a0.end" dur="4s" fill="remove"
        values="m110,228 h0 ; m110,228 h450 ; m110,228 h450 ; m110,228 h0" keyTimes="0;0.5;0.8;1" />
    </path>
    <path id="p2" d="m110,228 h0">
      <animate id="a2" attributeName="d" begin="a1.end" dur="4s" fill="remove"
        values="m110,228 h0 ; m110,228 h450 ; m110,228 h450 ; m110,228 h0" keyTimes="0;0.5;0.8;1" />
    </path>
    <path id="p3" d="m110,228 h0">
      <animate id="a3" attributeName="d" begin="a2.end" dur="4s" fill="remove"
        values="m110,228 h0 ; m110,228 h450 ; m110,228 h450 ; m110,228 h0" keyTimes="0;0.5;0.8;1" />
    </path>
  </defs>

  <g class="text type">
    <text><textPath xlink:href="#p0">cargo run --release ▌</textPath></text>
    <text><textPath xlink:href="#p1">git commit -m &quot;it works don&#39;t touch it&quot; ▌</textPath></text>
    <text><textPath xlink:href="#p2">why is my binary 200MB ▌</textPath></text>
    <text><textPath xlink:href="#p3">rm -rf / # wait no ▌</textPath></text>
  </g>
</svg>